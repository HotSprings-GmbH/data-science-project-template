name: Test template
on:
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: '0 5 * * 1'
jobs:
    contracts:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
            - run: uv sync --locked
            - run: uv run --no-sync pytest -m 'not bootstrap'
            - run: uv run --no-sync ruff check hooks tests
            - run: uv run --no-sync ruff format --check hooks tests
    bootstrap:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                manager: [uv, conda]
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
            - uses: conda-incubator/setup-miniconda@v3
              if: matrix.manager == 'conda'
              with:
                  auto-activate-base: false
            - run: uv sync --locked
            - run: uv run --no-sync pytest --bootstrap -m bootstrap -k '${{ matrix.manager }}'
