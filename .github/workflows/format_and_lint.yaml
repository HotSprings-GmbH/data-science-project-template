name: format_and_lint
on:
    pull_request:
        branches: [main]
    workflow_dispatch:
jobs:
    format_and_lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: astral-sh/setup-uv@v6
            - run: uv sync --locked
            - name: Run pre-commit and check commit messages
              run: |
                  uv run --no-sync pre-commit run --hook-stage manual --all-files
                  git fetch
                  uv run --no-sync bash ./check_commit_msgs.sh -c HEAD -m "remotes/origin/${{ github.event.repository.default_branch }}"
