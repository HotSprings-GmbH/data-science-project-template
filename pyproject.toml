[project]
name = "data-science-project-template"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "cookiecutter",
    "pre-commit",
    "pre-commit-hooks",
    "prettier",
    "pytest",
    "packaging",
    "pyyaml",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["{{cookiecutter.repo_name}}"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bootstrap: networked generated-project installation tests"]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
